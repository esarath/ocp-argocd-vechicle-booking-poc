name: car-rental-ci

on:
  push:
    branches: [main]
    paths:
      - "services/generic-svc/**"

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        working-directory: services/generic-svc
        run: pip install -r requirements.txt

      - name: Smoke-import the app
        working-directory: services/generic-svc
        run: python -c "import app"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: services/generic-svc
          push: true
          tags: |
            ghcr.io/esarath/car-rental-svc:${{ github.sha }}
            ghcr.io/esarath/car-rental-svc:latest

      # No direct push to main: branch protection on this repo requires a
      # PR + at least 1 approving review before anything reaches main, and
      # that applies to this bot too — no auto-approve, no bypass. This job
      # opens the tag-bump PR; a human still has to approve/merge it, ArgoCD
      # only syncs dev after that merge lands.
      - name: Open a PR bumping the dev overlay's image tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "car-rental-ci"
          git config user.email "car-rental-ci@users.noreply.github.com"
          BRANCH="ci/car-rental-svc-${{ github.sha }}"
          git checkout -b "$BRANCH"
          sed -i "s|newTag: .*|newTag: ${{ github.sha }}|" apps/car-rental/overlays/dev/kustomization.yaml
          git add apps/car-rental/overlays/dev/kustomization.yaml
          git diff --cached --quiet && { echo "No tag change, nothing to open a PR for."; exit 0; }
          git commit -m "ci: car-rental-svc ${{ github.sha }} -> dev"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "ci: car-rental-svc ${{ github.sha }} -> dev" \
            --body "Automated tag bump from car-rental-ci.yaml. Requires 1 approval before merge (branch protection) — ArgoCD syncs \`car-rental-dev\` only after this merges."
