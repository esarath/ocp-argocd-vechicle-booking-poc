name: car-rental-promote

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Validated SHA tag from the dev overlay to promote to prod"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm the tag was actually validated in dev
        run: |
          grep -q "newTag: ${{ inputs.image_tag }}" apps/car-rental/overlays/dev/kustomization.yaml || {
            echo "::error::${{ inputs.image_tag }} is not the tag currently deployed in dev — promote the validated tag, not an arbitrary one."
            exit 1
          }

      # Two human gates, not one: someone has to explicitly dispatch this
      # workflow with a tag, AND the PR it opens still needs a separate
      # approving review before merge (same branch protection as car-rental-ci)
      # — no auto-approve, no direct push to main, for prod either.
      - name: Open a PR bumping the prod overlay's image tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "car-rental-promote"
          git config user.email "car-rental-ci@users.noreply.github.com"
          BRANCH="promote/car-rental-svc-${{ inputs.image_tag }}"
          git checkout -b "$BRANCH"
          sed -i "s|newTag: .*|newTag: ${{ inputs.image_tag }}|" apps/car-rental/overlays/prod/kustomization.yaml
          git add apps/car-rental/overlays/prod/kustomization.yaml
          git commit -m "promote: car-rental-svc ${{ inputs.image_tag }} -> prod"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "promote: car-rental-svc ${{ inputs.image_tag }} -> prod" \
            --body "Manually dispatched by @${{ github.actor }}. Requires 1 approval before merge (branch protection) — ArgoCD syncs \`car-rental-prod\` only after this merges."
