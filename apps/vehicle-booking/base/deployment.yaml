apiVersion: apps/v1
kind: Deployment
metadata:
  name: vehicle-booking
  labels:
    app: vehicle-booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vehicle-booking
  template:
    metadata:
      labels:
        app: vehicle-booking
    spec:
      containers:
        - name: vehicle-booking
          # TODO: replace with the real vehicle-booking image
          image: quay.io/redhattraining/hello-world-nginx:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
