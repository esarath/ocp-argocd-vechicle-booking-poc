apiVersion: apps/v1
kind: Deployment
metadata:
  name: location-svc
  labels:
    app: location-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: location-svc
  template:
    metadata:
      labels:
        app: location-svc
    spec:
      containers:
        - name: location-svc
          image: ghcr.io/esarath/car-rental-svc:latest
          ports:
            - containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: "location-svc"
            - name: DB_SCHEMA
              value: "location"
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgresql:5432/$(POSTGRES_DB)"
          envFrom:
            - secretRef:
                name: postgresql-credentials
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
