apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing-svc
  labels:
    app: pricing-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pricing-svc
  template:
    metadata:
      labels:
        app: pricing-svc
    spec:
      containers:
        - name: pricing-svc
          image: ghcr.io/esarath/car-rental-svc:latest
          ports:
            - containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: "pricing-svc"
            - name: CATALOG_URL
              value: "http://catalog-svc:8080"
            - name: LOCATION_URL
              value: "http://location-svc:8080"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
