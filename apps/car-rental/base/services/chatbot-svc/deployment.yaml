apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-svc
  labels:
    app: chatbot-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatbot-svc
  template:
    metadata:
      labels:
        app: chatbot-svc
    spec:
      containers:
        - name: chatbot-svc
          image: ghcr.io/esarath/car-rental-svc:latest
          ports:
            - containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: "chatbot-svc"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: OLLAMA_URL
              value: "http://ollama:11434"
            - name: MCP_SERVER_URL
              value: "http://mcp-server:8080"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
