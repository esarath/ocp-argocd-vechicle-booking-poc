apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: car-rental-dev

resources:
  - ../../base

commonLabels:
  tenant-environment: dev

replicas:
  # Same CPU-headroom constraint as prod (see that overlay's comment) —
  # dev+prod combined don't fit this lab's ~5 vCPU allocatable alongside
  # platform/system pod overhead. Dev's own Phase 05 validation already
  # confirmed the chatbot/mcp-server AI path works with Ollama running;
  # pausing it here temporarily frees room for prod's Phase 07 validation
  # instead. Scale back up (or drop this override) once more capacity
  # exists, or once dev and prod aren't both needed running at once.
  - name: ollama
    count: 0

images:
  # CI (car-rental-ci.yaml) opens a PR bumping this tag on every push to
  # services/generic-svc/** — merge is required (branch protection), it does
  # not commit here directly. See architecture doc LLD 05 / execution guide
  # Phase 03 Task 7. This tag is real — car-rental-ci.yaml's first run (before
  # the PR-gate fix landed) auto-committed it directly; the image really is
  # pushed to ghcr.io under this SHA.
  - name: ghcr.io/esarath/car-rental-svc
    newTag: db13f268a208c6dc53ffc10885f35b217297d0b2
