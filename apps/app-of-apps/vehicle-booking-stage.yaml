apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vehicle-booking-stage
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: vehicle-booking
  source:
    repoURL: "https://github.com/esarath/ocp-argocd-vechicle-booking-poc.git"
    targetRevision: main
    path: apps/vehicle-booking/overlays/stage
  destination:
    server: https://kubernetes.default.svc
    namespace: vehicle-booking-stage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
