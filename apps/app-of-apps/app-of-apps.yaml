apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: car-rental-app-of-apps
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: car-rental
  source:
    repoURL: "https://github.com/esarath/ocp-argocd-vechicle-booking-poc.git"
    targetRevision: main
    path: apps/app-of-apps
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
